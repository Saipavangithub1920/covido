apiVersion: apps/v1
kind: Deployment
metadata:
  name: covidodeployment
spec:
  replicas: 2
  selector:
    matchLabels:
      name: covido
      version: v1
  template:
    metadata:  
      labels:  
        name: covido
        version: v1
    spec:
      containers:  
        - name: covidocontainer
          image: saipavangockerhub/covido:3.0
          ports:
            - containerPort: 8080
              name: tomcatport
              protocol: TCP
          env:
            - name: spring_datasource_url
              valueFrom:
                configMapKeyRef:  
                  key: mysqlurl
                  name: covidoconfigmap
            - name: spring_datasource_username
              valueFrom:
                secretKeyRef:  
                  key: username
                  name: covidomysqlsecret
            - name: spring_datasource_password
              valueFrom:
                secretKeyRef:  
                  key: password
                  name: covidomysqlsecret
      